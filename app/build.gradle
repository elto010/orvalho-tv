plugins {
    id 'com.android.application'
}

android {
    namespace 'app.orvalho.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'app.orvalho.launcher'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Chave fixa: toda versão nova instala por cima da anterior sem perder ajustes.
    signingConfigs {
        orvalho {
            storeFile file('orvalho.jks')
            storePassword 'orvalho-tv'
            keyAlias 'orvalho'
            keyPassword 'orvalho-tv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.orvalho
        }
        debug {
            signingConfig signingConfigs.orvalho
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
